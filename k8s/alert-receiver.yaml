# Throwaway debug tool: proves Alertmanager's routing actually delivers
# somewhere, by logging received payloads. Not part of the app, not
# scraped by Prometheus, no /metrics endpoint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-receiver
  namespace: observability
  labels:
    app: alert-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-receiver
  template:
    metadata:
      labels:
        app: alert-receiver
    spec:
      containers:
        - name: alert-receiver
          image: alert-receiver:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: alert-receiver
  namespace: observability
  labels:
    app: alert-receiver
spec:
  selector:
    app: alert-receiver
  ports:
    - name: http
      port: 8090
      targetPort: 8090
