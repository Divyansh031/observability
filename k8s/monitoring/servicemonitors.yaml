# ServiceMonitor is a Prometheus Operator CRD, not a core Kubernetes
# resource — it only exists because kube-prometheus-stack installed it.
# It tells the Operator's Prometheus which Services to scrape and how.
#
# The `release: kube-prometheus-stack` label is required: the chart
# configures Prometheus to only pick up ServiceMonitors carrying that exact
# label (matching the Helm release name) — without it, Prometheus silently
# ignores these and no traffic ever gets scraped.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: inventory-service
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: inventory-service
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
